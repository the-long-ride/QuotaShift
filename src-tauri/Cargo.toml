[package]
name = "quotashift"
version = "1.1.1"
description = "QuotaShift - AI Quota & Account Swapper"
authors = ["the-long-ride"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
regex = "1"
tokio = { version = "1", features = ["time", "macros", "net", "sync", "io-util"] }
raw-window-handle = "0.6"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10.3"
rand = "0.8"
tauri-plugin-store = "2.4.3"
toml_edit = "0.25"
chrono = "0.4"
sysinfo = "0.31"
tauri-plugin-notification = "2"

# -----------------------------------------------------------------------------
# Security patch — RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g
#
# Tauri 2's Linux GTK3 stack still constrains glib to 0.18.x, while the first
# published non-vulnerable glib release is 0.20.0. Use a source-compatible
# 0.18.5 backport containing only the upstream VariantStrIter soundness fix.
#
# The pinned revision is the backport commit itself. Its diff changes only the
# FFI out-parameter in VariantStrIter::impl_get from &p to &mut p, matching
# gtk-rs/gtk-rs-core#1343. Keep the immutable revision pin; do not track a
# branch here.
# -----------------------------------------------------------------------------

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[patch.crates-io]
glib = { git = "https://github.com/andrew-wommack-ministries/glib-rustsec-2024-0429-backport", rev = "9e2bb20e2daba5b4dc5e2c9f4dee0797a1503b9f" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
