version: 2
updates:
  # Rust / Tauri backend dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g
      # Stable Tauri 2.11.5 still resolves gtk 0.18.x -> glib 0.18.x on Linux,
      # so Dependabot cannot produce a compatible registry upgrade to glib >=0.20.
      # Cargo.toml instead pins the reviewed source-compatible 0.18.5 backport at
      # immutable commit 9e2bb20e2daba5b4dc5e2c9f4dee0797a1503b9f.
      # This ignore suppresses impossible version-update PRs only; it is not the
      # runtime mitigation. Remove it when a stable Tauri graph accepts glib >=0.20.
      - dependency-name: "glib"
        versions: [">=0.15.0, <0.20.0"]

  # Frontend / Node dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
