name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows desktop binaries'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux desktop binaries'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - manual/windows-build

jobs:
  build-windows:
    name: Build Desktop (Windows)
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set Windows cargo target dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\cargo-target" -Force | Out-Null
          "CARGO_TARGET_DIR=C:/cargo-target/quotashift" | Add-Content -Path $env:GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> C:/cargo-target/quotashift'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm build:release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quotashift-windows
          path: release/*
          if-no-files-found: error

  build-linux:
    name: Build Desktop (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm build:release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quotashift-linux
          path: release/*
          if-no-files-found: error
