name: Publish Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'windows'
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
          - platform: 'macos-latest'
            os-name: 'macos'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install system dependencies (Linux only)
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set Windows cargo target dir
        if: matrix.os-name == 'windows'
        run: |
          New-Item -ItemType Directory -Path "C:\cargo-target" -Force | Out-Null
          "CARGO_TARGET_DIR=C:/cargo-target/quotashift" | Add-Content -Path $env:GITHUB_ENV

      - name: Rust cache (Linux / macOS)
        if: matrix.os-name == 'linux' || matrix.os-name == 'macos'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust cache (Windows)
        if: matrix.os-name == 'windows'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> C:/cargo-target/quotashift'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend (tsc + vite build)
        run: pnpm build

      - name: Verify Rust (cargo test, Linux only)
        if: matrix.os-name == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Verify Rust (cargo check)
        run: cargo check --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build desktop app
        run: pnpm run build:release

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os-name }}
          path: |
            release/*

  create-release:
    name: Create GitHub Release
    needs: [build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten and check artifacts
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -R release-assets

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          REPO="${{ github.repository }}"
          CHANGELOG_URL="https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md"
          ASSET_BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cat << EOF > release-body.md
          > **[View full Changelog](${CHANGELOG_URL})**

          ## Download

          Choose the file that matches your platform and preferred install method:

          | Platform | Download | Description |
          | --- | --- | --- |
          EOF

          cd release-assets
          append_release_row() {
            file="$1"
            [ -f "$file" ] || return 0

            case "$file" in
              *-portable.exe)
                platform="Windows"
                description="Portable app — download and run directly, no installation needed"
                ;;
              *-setup.exe)
                platform="Windows"
                description="Installer — installs QuotaShift to your system"
                ;;
              *.dmg)
                platform="macOS"
                description="Disk image installer for macOS"
                ;;
              *.deb)
                platform="Linux"
                description="Debian/Ubuntu package"
                ;;
              *.AppImage)
                platform="Linux"
                description="Portable Linux app (run on any distro)"
                ;;
              *)
                return 0
                ;;
            esac

            encoded_file=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$file")
            echo "| ${platform} | [\`${file}\`](${ASSET_BASE_URL}/${encoded_file}) | ${description} |" >> ../release-body.md
          }

          for file in *-portable.exe *-setup.exe; do append_release_row "$file"; done
          for file in *.dmg; do append_release_row "$file"; done
          for file in *.deb *.AppImage; do append_release_row "$file"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: |
            release-assets/*-portable.exe
            release-assets/*-setup.exe
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
