name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'windows'
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install system dependencies (Linux only)
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set Windows cargo target dir
        if: matrix.os-name == 'windows'
        run: |
          New-Item -ItemType Directory -Path "C:\cargo-target" -Force | Out-Null
          "CARGO_TARGET_DIR=C:/cargo-target/quotashift" | Add-Content -Path $env:GITHUB_ENV

      - name: Rust cache (Linux)
        if: matrix.os-name == 'linux'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust cache (Windows)
        if: matrix.os-name == 'windows'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> C:/cargo-target/quotashift'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend utility tests
        if: matrix.os-name == 'linux'
        run: |
          rm -rf .test-build
          pnpm exec tsc src/utils/account-selection.ts src/utils/account-last-used.ts src/utils/codex-model-display.ts src/utils/codex-pools.ts src/utils/codex-usage-windows.ts src/utils/codex-models.ts src/utils/codex-router.ts src/utils/types.ts --outDir .test-build --module ES2022 --target ES2022 --moduleResolution bundler --skipLibCheck
          node --test tests/codex-model-display-last-used.test.mjs tests/codex-model-ui-last-used-contract.test.mjs tests/codex-models.test.mjs tests/codex-models-backend-contract.test.mjs tests/codex-models-app-contract.test.mjs tests/codex-models-ui-contract.test.mjs tests/codex-pools.test.mjs tests/codex-usage-windows.test.mjs tests/codex-usage-card-contract.test.mjs tests/codex-pools-ui-contract.test.mjs tests/codex-router.test.mjs tests/codex-router-review-contract.test.mjs tests/codex-router-app-contract.test.mjs tests/codex-router-ui-contract.test.mjs tests/codex-router-contract.test.mjs tests/codex-pools-app-contract.test.mjs tests/antigravity-runtime-switch-contract.test.mjs

      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Rust tests (Linux only)
        if: matrix.os-name == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --verbose
