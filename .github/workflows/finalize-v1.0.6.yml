name: Finalize v1.0.6

on:
  push:
    branches:
      - feature/claude-guardrail-editable-badges

permissions:
  contents: write

jobs:
  finalize:
    name: Tag main and delete merged branch
    if: github.repository == 'the-long-ride/QuotaShift'
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.6 tag at merged main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 282223dd9806b52609060a9f3b9ba6d17ed64099
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/refs" \
            -d "{\"ref\":\"refs/tags/v1.0.6\",\"sha\":\"${TARGET_SHA}\"}"

      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/refs/heads/feature%2Fclaude-guardrail-editable-badges"
